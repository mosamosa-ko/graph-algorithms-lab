<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="TTSP reduction trace">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  <style>
    .edge { stroke: #64748b; stroke-width: 2; }
    .vertex { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
    .terminal { fill: #67e8f9; stroke: #0e7490; stroke-width: 3; }
    .operator { fill: #0f766e; stroke: #134e4a; stroke-width: 2; }
    .leaf { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .label { fill: #0f172a; font: 600 13px ui-monospace, monospace; }
    .operator + .label { fill: #ffffff; }
    .step { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
    .step-title { fill: #0f766e; font: 700 13px ui-sans-serif, sans-serif; }
    .small { fill: #334155; font: 12px ui-sans-serif, sans-serif; }
  </style>
</defs>
<rect x="24" y="28" width="130" height="74" rx="10" class="step"/>
<text x="36" y="52" class="step-title">PARALLEL</text>
<text x="36" y="75" class="small">remove 2 edges</text>
<text x="36" y="93" class="small">4 edge(s) left</text>
<path d="M157,65 L173,65" class="edge" marker-end="url(#arrow)"/>
<rect x="178" y="28" width="130" height="74" rx="10" class="step"/>
<text x="190" y="52" class="step-title">SERIES</text>
<text x="190" y="75" class="small">eliminate v1</text>
<text x="190" y="93" class="small">3 edge(s) left</text>
<path d="M311,65 L327,65" class="edge" marker-end="url(#arrow)"/>
<rect x="332" y="28" width="130" height="74" rx="10" class="step"/>
<text x="344" y="52" class="step-title">PARALLEL</text>
<text x="344" y="75" class="small">remove 2 edges</text>
<text x="344" y="93" class="small">2 edge(s) left</text>
<path d="M465,65 L481,65" class="edge" marker-end="url(#arrow)"/>
<rect x="486" y="28" width="130" height="74" rx="10" class="step"/>
<text x="498" y="52" class="step-title">SERIES</text>
<text x="498" y="75" class="small">eliminate v0</text>
<text x="498" y="93" class="small">1 edge(s) left</text>
</svg>